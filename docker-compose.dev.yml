# Developer / reviewer stack: build React client + backend from this git checkout.
# From the repository root:
#   bash scripts/setup-dev.sh
#   docker compose -f docker-compose.dev.yml up --build
#
# Then open http://localhost:8080/hi-ee/  (login: hiadmin / hiadmin)
#
# MongoDB demo service hostname inside this Compose network: mongodb
# Example JDBC URL from the hiee container:
#   mongodb://hi_mongo:hi_mongo_dev@mongodb:27017/hi_demo?authSource=admin

services:
  postgres:
    image: postgres:15.8-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiuser}
      POSTGRES_DB: ${POSTGRES_DB:-hiee}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiuser} -d ${POSTGRES_DB:-hiee}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hinet

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hi_mongo
      MONGO_INITDB_ROOT_PASSWORD: hi_mongo_dev
      MONGO_INITDB_DATABASE: hi_demo
    volumes:
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
      - hi_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "hi_mongo", "-p", "hi_mongo_dev", "--authenticationDatabase", "admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hinet

  hiee:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      HOST_IP: ${HOST_IP:-localhost}
      INSTALL_CHROME: ${INSTALL_CHROME:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/hi-ee/applicationSettings || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    ports:
      - "8080:8080"
    volumes:
      - ./server/hi-repository:/usr/local/Helical Insight/hi/hi-repository
    networks:
      - hinet

  instantbi:
    image: python:3.13-slim
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      # Live-edit source; overlay config and logs like docker/docker-compose.yml
      - ./instantbi/src/com/helicalinsight/instantbi:/app
      - ./server/hi-repository/System/InstantBI:/app/helicalbi/config
      - ./server/hi-repository/System/Logs:/app/logs
    working_dir: /app
    command: bash -c "pip install -q -r requirements.txt && python app.py"
    networks:
      - hinet

networks:
  hinet:
    driver: bridge

volumes:
  pgdata:
  hi_mongo_data:
